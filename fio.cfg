# follow crystal disk test case
[global]
ioengine=io_uring
direct=1
time_based=1
runtime=15
ramp_time=10
group_reporting=1
log_avg_msec=500
randrepeat=0
norandommap=1
refill_buffers=1

# Sequential Read - 1MiB Q8T1
[SEQ1M_Q8T1_READ]
rw=read
bs=1M
iodepth=8
numjobs=1
write_bw_log=fio_SEQ1M_Q8T1_READ
stonewall

# Sequential Write - 1MiB Q8T1
[SEQ1M_Q8T1_WRITE]
rw=write
bs=1M
iodepth=8
numjobs=1
write_bw_log=fio_SEQ1M_Q8T1_WRITE
stonewall

# Sequential Read - 1MiB Q1T1
[SEQ1M_Q1T1_READ]
rw=read
bs=1M
iodepth=1
numjobs=1
write_bw_log=fio_SEQ1M_Q1T1_READ
stonewall

# Sequential Write - 1MiB Q1T1
[SEQ1M_Q1T1_WRITE]
rw=write
bs=1M
iodepth=1
numjobs=1
write_bw_log=fio_SEQ1M_Q1T1_WRITE
stonewall

# Random Read - 4KiB Q32T1
[RND4K_Q32T1_READ]
rw=randread
bs=4k
iodepth=32
numjobs=1
write_bw_log=fio_RND4K_Q32T1_READ
stonewall

# Random Write - 4KiB Q32T1
[RND4K_Q32T1_WRITE]
rw=randwrite
bs=4k
iodepth=32
numjobs=1
write_bw_log=fio_RND4K_Q32T1_WRITE
stonewall

# Random Read - 4KiB Q1T1
[RND4K_Q1T1_READ]
rw=randread
bs=4k
iodepth=1
numjobs=1
write_bw_log=fio_RND4K_Q1T1_READ
stonewall

# Random Write - 4KiB Q1T1
[RND4K_Q1T1_WRITE]
rw=randwrite
bs=4k
iodepth=1
numjobs=1
write_bw_log=fio_RND4K_Q1T1_WRITE
stonewall